<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karteikarten-App</title>
    <meta name="description" content="Intelligentes Lernen mit Karteikarten" />
    
    <!-- SPA-Routing für GitHub Pages -->
    <script>
      (function() {
        var path = window.location.pathname;
        var repo = '/Karteikartenapp';
        
        if (path.indexOf(repo) === 0 && path !== repo + '/' && !path.match(/\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$/)) {
          sessionStorage.setItem('spa-redirect', path + window.location.search + window.location.hash);
          window.location.replace(repo + '/');
        }
        
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>
    
    <!-- Dark Mode Erkennung -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
